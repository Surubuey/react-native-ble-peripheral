apply plugin: "com.android.library"

android {
    compileSdkVersion 33 // Update to 33 or the latest stable version
    buildToolsVersion "33.0.2" // Update to the latest stable version of build tools

    defaultConfig {
        minSdkVersion 23 // Keep this as 23 if your app must support Android 6.0+
        targetSdkVersion 33 // Update to 33 or the latest stable version
        versionCode 1
        versionName "1.0"

        // Remove deprecated NDK block. Modern Gradle configurations handle this automatically.
    }

    // Ensure compatibility for Java 8 or higher
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Enable Jetifier and AndroidX if required
    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.appcompat:appcompat:1.6.1" // Replace old support library with AndroidX
    implementation "com.facebook.react:react-native:+"  // From node_modules
}
